<!DOCTYPE html>
<html>
    <head>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                background-color: black;
                color: white;
                margin: auto;
            }
            .outer {
                background-image: url(blue_velvet.png);
                background-repeat: repeat;
                margin: 2em auto;
                padding: auto;
                width: 95%;
            }
            .inner {
                background-color: black;
                width: 95%;
                margin: auto;
                padding: 2em;
            }
        </style>
    </head>

    <body>
        <div class="outer">
            <div class="inner">
                <h1>This is a practice website</h1>
                <p>Put some words here so the computer can show me what it does.</p>
            </div>
        </div>

    </body>


</html>
