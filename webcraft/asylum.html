<!DOCTYPE html>
<html>
	<header>
		<style>
			:root {
				--light-pink: #ffcccc;
				--mid-pink: #F2A6A8;
				--dark-pink: #D86788;
				--red: #741A1C;
				--grey: #363230;

				--border: 3px solid #D86788;
			}

			body {
				background-color: #000;
			}

			#header {
				margin: 50px auto;
				height: 135px;
				width: 802px;
				background-color: var(--light-pink);
				border: var(--border);
				color: var(--red);
			}

			#container {
				margin: auto;
				padding: 25px;
				width: 802px;
				height: 1000px;
				box-sizing: border-box;
				background-color: var(--grey);
				border: var(--border);
			}
			
			#menu {
				margin: 25px auto;
				width: 720px;
				height: 76px;
				background-color: var(--light-pink);
				box-sizing: border-box;
				border: var(--border);
				color: var(--red);
			}

			#menu a {
				color: var(--red);
				text-decoration: none;
				font-weight: bold;
			}
			#menu a:hover {
				background-color: var(--dark-pink);
				text-decoration: underline;
				color: var(--grey);
			}

			#menu a:visited {
				color: var(--grey);
			}

			#mainsection {
				margin: auto;
				padding: 25px;
				width: 720px;
				height: 700px;
				box-sizing:border-box;
				background-color: var(--mid-pink);
				border: var(--border);
				overflow-y: auto;
				color: var(--grey);
			}

			#outerfoot {
				margin: 25px auto;
				width: 720px;
				height: 76px; 
				background-color: var(--light-pink);
				box-sizing: border-box;
				border: var(--border);
			}
			.innerfoot {
				margin: auto auto;
				padding: 15px;
				box-sizing: border-box;
				text-align: center;
				color: var(--red);
			}
		</style>
	</header>
	<body>
		<!--Little top section-->
		<div id="header" style="">
		</div>

		<!--Main container-->
		<div id="container">
			<!--Nav menu section-->
			<div id="menu">
				<div class="nav" style="margin: auto auto; padding: 15px; box-sizing: border-box; text-align: center;">
					<a href=#home>HOME</a> . ABOUT. STUFF. THINGS. ONE. TWO. THREE
					<br>
				SIGN THE GUESTBOOK . EAT YOUR VEGETABLES</div>
			</div>

			<!--Main content-->
			<div id="mainsection">
				<p>This is a website layout based on Emilie Autumn's old website, only I had to recode it from scratch since the old one uses tables for everything.</p>
			</div>

			<!--Internal footer thing-->
			<div id="outerfoot">
				<div class="innerfoot">WEBRINGS GO HERE</div>
			</div>
			
		</div>
	</body>
</html>
